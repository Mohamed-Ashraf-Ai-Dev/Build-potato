name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path to application zip file'
        required: false
        default: 'myapp.zip'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK 3.41.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'

      - name: Install Python dependencies
        run: |
          python3 -m pip install pyyaml

      - name: Run Build Engine (Debug APK)
        run: |
          PYTHONPATH=build-engine:signing python3 build-engine/orchestrator.py \
            --zip "${{ github.event.inputs.zip_path }}" \
            --type debug-apk \
            --output app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app-debug.apk
          retention-days: 1
